<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labor Queue</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/labor-queue-modified-bootstrap.css" />
    <link rel="stylesheet" href="/css/labor-queue.css" />
  </head>
  <body class="bg-dark text-light">
    <div class="container py-4">
      <header class="mb-4 text-center">
        <h1>Labor Queue</h1>
      </header>
      <!-- Top Options -->
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <a href="/admin" class="btn btn-primary">User Management</a>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="excludeRecentLaborShares"
            checked
          />
          <label class="form-check-label" for="excludeRecentLaborShares"
            >Exclude recent labor shares</label
          >
        </div>
      </div>
      <div class="row">
        <!-- Left Column: Labor Lists -->
        <div class="col-md-8">
          <ul class="nav nav-tabs mb-3" id="jobTypeTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="dock-tab"
                data-bs-toggle="tab"
                data-bs-target="#dock"
                type="button"
                role="tab"
              >
                Dock
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="reach-tab"
                data-bs-toggle="tab"
                data-bs-target="#reach"
                type="button"
                role="tab"
              >
                Reach
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="op-tab"
                data-bs-toggle="tab"
                data-bs-target="#op"
                type="button"
                role="tab"
              >
                OP
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="clamp-tab"
                data-bs-toggle="tab"
                data-bs-target="#clamp"
                type="button"
                role="tab"
              >
                Clamp
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="hau2-tab"
                data-bs-toggle="tab"
                data-bs-target="#hau2"
                type="button"
                role="tab"
              >
                HAU2
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="relo-tab"
                data-bs-toggle="tab"
                data-bs-target="#relo"
                type="button"
                role="tab"
              >
                RELO
              </button>
            </li>
          </ul>
          <div class="tab-content" id="jobTypeTabsContent">
            <!-- Dock Tab -->
            <div
              class="tab-pane fade show active"
              id="dock"
              role="tabpanel"
              aria-labelledby="dock-tab"
            >
              <h2 class="h5 text-center mb-3">Dock</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="dockList">
                    <!-- Data rows go here -->
                  </tbody>
                </table>
              </div>
            </div>
            <!-- Reach Tab -->
            <div
              class="tab-pane fade"
              id="reach"
              role="tabpanel"
              aria-labelledby="reach-tab"
            >
              <h2 class="h5 text-center mb-3">Reach</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="reachList"></tbody>
                </table>
              </div>
            </div>
            <!-- OP Tab -->
            <div
              class="tab-pane fade"
              id="op"
              role="tabpanel"
              aria-labelledby="op-tab"
            >
              <h2 class="h5 text-center mb-3">OP</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="opList"></tbody>
                </table>
              </div>
            </div>
            <!-- Clamp Tab -->
            <div
              class="tab-pane fade"
              id="clamp"
              role="tabpanel"
              aria-labelledby="clamp-tab"
            >
              <h2 class="h5 text-center mb-3">Clamp</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="clampList"></tbody>
                </table>
              </div>
            </div>
            <!-- HAU2 Tab -->
            <div
              class="tab-pane fade"
              id="hau2"
              role="tabpanel"
              aria-labelledby="hau2-tab"
            >
              <h2 class="h5 text-center mb-3">HAU2</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="hau2List"></tbody>
                </table>
              </div>
            </div>
            <!-- RELO Tab -->
            <div
              class="tab-pane fade"
              id="relo"
              role="tabpanel"
              aria-labelledby="relo-tab"
            >
              <h2 class="h5 text-center mb-3">RELO</h2>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Total Time</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="list" id="reloList"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        <!-- Right Column: Queue -->
        <div class="col-md-4">
          <div class="card bg-secondary mb-3">
            <div class="card-header">
              <h2 class="h5">Queue</h2>
            </div>
            <div class="card-body">
              <div class="mb-3 text-end">
                <button id="resetQueueButton" class="btn btn-warning btn-sm">
                  Reset Queue
                </button>
              </div>
              <div class="table-responsive">
                <table class="table table-dark table-striped">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Time Till EOS</th>
                      <th>Job Type</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="queueTableBody">
                    <!-- Queue items will be inserted here -->
                  </tbody>
                </table>
              </div>
              <button id="submitQueueButton" class="btn btn-success w-100 mt-3">
                Submit Queue
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/list.js@2.3.1/dist/list.js"></script>
    <script src="/js/labor-queue.js"></script>
  </body>
</html>
