<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Data Management</title>
    <!-- Use the same or similar Bootstrap version -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- If you have a common modified-bootstrap.css, you can include it here -->
    <link rel="stylesheet" href="/css/modified-bootstrap.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="bg-dark text-light">
    <div class="container my-5">
      <div class="card bg-secondary border-0 mb-4">
        <div class="card-header bg-secondary">
          <h3 class="mb-0">User Management</h3>
        </div>
        <div class="card-body">
          <table class="table table-dark table-striped">
            <thead>
              <tr>
                <th>Name</th>
                <th>Total Time</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="userList">
              <!-- Populated by admin.js -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Buttons below the card -->
      <div class="d-flex flex-wrap gap-2">
        <button
          type="button"
          class="btn btn-secondary"
          data-bs-toggle="modal"
          data-bs-target="#newUserModal"
        >
          New User
        </button>
        <!-- Uncomment if you need a clear all users button -->
        <!-- <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#clearUsersModal">Clear All Users</button> -->
        <a href="/laborqueue" class="btn btn-primary">User Queue</a>
        <select id="backupFilesDropdown" class="form-select w-auto">
          <!-- Options will be dynamically populated -->
        </select>
        <button type="button" class="btn btn-warning" id="backupUsersButton">
          Backup User Data
        </button>
        <button type="button" class="btn btn-success" id="restoreUsersButton">
          Restore Selected Backup
        </button>
        <button type="button" class="btn btn-danger" id="deleteBackupButton">
          Delete Selected Backup
        </button>
      </div>
    </div>

    <!-- Update User Modal -->
    <div
      class="modal fade"
      id="updateUserModal"
      tabindex="-1"
      aria-labelledby="updateUserModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title" id="updateUserModalLabel">Update User</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="updateUserForm" autocomplete="off">
              <div class="mb-3">
                <label for="updateUserName" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="updateUserName"
                  name="name"
                  required
                />
              </div>
              <div class="row mb-3">
                <div class="col">
                  <label for="updateUserHours" class="form-label">Hours</label>
                  <input
                    type="number"
                    class="form-control input-fixed-width"
                    id="updateUserHours"
                    name="updateUserHours"
                    required
                  />
                </div>
                <div class="col">
                  <label for="updateUserMinutes" class="form-label"
                    >Minutes</label
                  >
                  <input
                    type="number"
                    class="form-control input-fixed-width"
                    id="updateUserMinutes"
                    name="updateUserMinutes"
                    required
                  />
                </div>
              </div>
              <fieldset class="mb-3">
                <legend>Jobs Trained</legend>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="updateReach"
                    name="jobsTrained"
                    value="reach"
                  />
                  <label class="form-check-label" for="updateReach"
                    >Reach</label
                  >
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="updateOP"
                    name="jobsTrained"
                    value="OP"
                  />
                  <label class="form-check-label" for="updateOP">OP</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="updateClamp"
                    name="jobsTrained"
                    value="clamp"
                  />
                  <label class="form-check-label" for="updateClamp"
                    >Clamp</label
                  >
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="updateRelo"
                    name="jobsTrained"
                    value="relo"
                  />
                  <label class="form-check-label" for="updateRelo">Relo</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="updateHAU2"
                    name="jobsTrained"
                    value="hau2"
                  />
                  <label class="form-check-label" for="updateHAU2">HAU2</label>
                </div>
              </fieldset>
            </form>
            <!-- Labor Shares Table -->
            <table class="table table-dark table-striped">
              <thead>
                <tr>
                  <th>Job Type</th>
                  <th>Minutes</th>
                  <th>Timestamp</th>
                </tr>
              </thead>
              <tbody id="laborSharesTableBody">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="updateUserButton">
              Update
            </button>
            <button type="button" class="btn btn-danger" id="deleteUserButton">
              Delete User
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- New User Modal -->
    <div
      class="modal fade"
      id="newUserModal"
      tabindex="-1"
      aria-labelledby="newUserModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header">
            <h5 class="modal-title" id="newUserModalLabel">New User</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="newUserForm" autocomplete="off">
              <div class="mb-3">
                <label for="newUserName" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="newUserName"
                  name="name"
                  required
                />
              </div>
              <div class="row mb-3">
                <div class="col">
                  <label for="modalUserHours" class="form-label">Hours</label>
                  <input
                    type="number"
                    class="form-control input-fixed-width"
                    name="modalUserHours"
                    required
                  />
                </div>
                <div class="col">
                  <label for="modalUserMinutes" class="form-label"
                    >Minutes</label
                  >
                  <input
                    type="number"
                    class="form-control input-fixed-width"
                    name="modalUserMinutes"
                    required
                  />
                </div>
              </div>
              <fieldset class="mb-3">
                <legend>Jobs Trained</legend>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="newReach"
                    name="jobsTrained"
                    value="reach"
                  />
                  <label class="form-check-label" for="newReach">Reach</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="newOP"
                    name="jobsTrained"
                    value="OP"
                  />
                  <label class="form-check-label" for="newOP">OP</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="newClamp"
                    name="jobsTrained"
                    value="clamp"
                  />
                  <label class="form-check-label" for="newClamp">Clamp</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="newRelo"
                    name="jobsTrained"
                    value="relo"
                  />
                  <label class="form-check-label" for="newRelo">Relo</label>
                </div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="newHAU2"
                    name="jobsTrained"
                    value="hau2"
                  />
                  <label class="form-check-label" for="newHAU2">HAU2</label>
                </div>
              </fieldset>
              <button type="submit" class="btn btn-primary w-100">
                Create User
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
