<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Data Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/modified-bootstrap.css">
  <link rel="stylesheet" href="/css/admin.css">
  <!-- Include Tablesort and its number module -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/sorts/tablesort.number.min.js"></script>
</head>
<body>

<div class="container mt-5">
  <!-- Top status bar with current time and shift info -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">System Status</h5>
      <div>
        Current Time: <span id="current-time" class="fw-bold">Loading...</span>
      </div>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <label for="shift-select" class="form-label">Select Shift:</label>
          <select id="shift-select" class="form-select">
            <option value="all">All Shifts</option>
            <!-- Shifts will be populated dynamically -->
          </select>
        </div>
        <div class="col-md-4">
          <div class="mt-2">
            Current Shift: <span id="current-shift" class="fw-bold">-</span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="mt-2">
            Time Till End of Shift: <span id="time-till-end" class="fw-bold">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- User management card -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">User Management</h5>
      <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newUserModal">New User</button>
    </div>
    <div class="card-body">
      <table class="table table-striped" id="usersTable">
        <thead>
          <tr>
            <th class="sort" data-sort="name">Name</th>
            <th class="sort" data-sort="shift">Shift</th>
            <th class="sort" data-sort="totaltime">Total Time</th>
            <th class="sort" data-sort="reach">Reach</th>
            <th class="sort" data-sort="op">OP</th>
            <th class="sort" data-sort="clamp">Clamp</th>
            <th class="sort" data-sort="relo">Relo</th>
            <th class="sort" data-sort="hau2">HAU2</th>
            <th class="sort" data-sort="actions">Actions</th>
          </tr>
        </thead>
        <tbody id="userList">
          <!-- Users will be populated dynamically -->
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Navigation and tools card -->
  <div class="card mb-3">
    <div class="card-header">
      <h5 class="mb-0">Tools</h5>
    </div>
    <div class="card-body">
      <div class="row mb-3">
        <div class="col-md-6">
          <a href="/laborqueue" class="btn btn-primary w-100">User Queue</a>
        </div>
        <div class="col-md-6">
          <a href="/config-page" class="btn btn-info w-100">Configuration</a>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <div class="card">
            <div class="card-header">Backup Management</div>
            <div class="card-body">
              <div class="mb-3">
                <select id="backupFilesDropdown" class="form-select">
                  <!-- Backup files will be populated dynamically -->
                </select>
              </div>
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-warning flex-grow-1" id="backupUsersButton">Create Backup</button>
                <button type="button" class="btn btn-success flex-grow-1" id="restoreUsersButton">Restore Selected</button>
                <button type="button" class="btn btn-danger flex-grow-1" id="deleteBackupButton">Delete Selected</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Update User Modal -->
<div class="modal fade" id="updateUserModal" tabindex="-1" aria-labelledby="updateUserModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updateUserModalLabel">Update User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <!-- Form content here -->
        <form id="updateUserForm" autocomplete="off">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="updateUserName" class="form-label">Name</label>
              <input type="text" class="form-control" id="updateUserName" name="name" required>
            </div>
            <div class="col-md-6">
              <label for="updateUserShift" class="form-label">Shift</label>
              <select class="form-select" id="updateUserShift" name="shift">
                <option value="">No Shift</option>
                <!-- Shift options will be populated dynamically -->
              </select>
            </div>
          </div>
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="updateUserHours" class="form-label">Hours</label>
              <input type="number" class="form-control" id="updateUserHours" name="updateUserHours" required>
            </div>
            <div class="col-md-6">
              <label for="updateUserMinutes" class="form-label">Minutes</label>
              <input type="number" class="form-control" id="updateUserMinutes" name="updateUserMinutes" required>
            </div>
          </div>
          
          <fieldset class="mb-3">
            <legend>Jobs Trained</legend>
            <div class="row">
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="updateReach" name="jobsTrained" value="reach">
                  <label class="form-check-label" for="updateReach">Reach</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="updateOP" name="jobsTrained" value="OP">
                  <label class="form-check-label" for="updateOP">OP</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="updateClamp" name="jobsTrained" value="clamp">
                  <label class="form-check-label" for="updateClamp">Clamp</label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="updateRelo" name="jobsTrained" value="relo">
                  <label class="form-check-label" for="updateRelo">Relo</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="updateHAU2" name="jobsTrained" value="hau2">
                  <label class="form-check-label" for="updateHAU2">HAU2</label>
                </div>
              </div>
            </div>
          </fieldset>
        </form>
        
        <!-- Labor Shares Table -->
        <div class="mt-4">
          <h5>Labor Share History</h5>
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Job Type</th>
                <th>Minutes</th>
                <th>Timestamp</th>
              </tr>
            </thead>
            <tbody id="laborSharesTableBody">
              <!-- Labor shares will be populated dynamically -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="updateUserButton">Update</button>
        <button type="button" class="btn btn-danger" id="deleteUserButton">Delete User</button>
      </div>
    </div>
  </div>
</div>

<!-- New User Modal -->
<div class="modal fade" id="newUserModal" tabindex="-1" aria-labelledby="newUserModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newUserModalLabel">New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="newUserForm" autocomplete="off">
          <div class="row mb-3">
            <div class="col-md-7">
              <label for="newUserName" class="form-label">Name</label>
              <input type="text" class="form-control" id="newUserName" name="name" required>
            </div>
            <div class="col-md-5">
              <label for="newUserShift" class="form-label">Shift</label>
              <select class="form-select" id="newUserShift" name="shift">
                <option value="">No Shift</option>
                <!-- Shift options will be populated dynamically -->
              </select>
            </div>
          </div>
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="modalUserHours" class="form-label">Hours</label>
              <input type="number" class="form-control" name="modalUserHours" id="modalUserHours" required>
            </div>
            <div class="col-md-6">
              <label for="modalUserMinutes" class="form-label">Minutes</label>
              <input type="number" class="form-control" name="modalUserMinutes" id="modalUserMinutes" required>
            </div>
          </div>
          
          <fieldset class="mb-3">
            <legend>Jobs Trained</legend>
            <div class="row">
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="newReach" name="jobsTrained" value="reach">
                  <label class="form-check-label" for="newReach">Reach</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="newOP" name="jobsTrained" value="OP">
                  <label class="form-check-label" for="newOP">OP</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="newClamp" name="jobsTrained" value="clamp">
                  <label class="form-check-label" for="newClamp">Clamp</label>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="newRelo" name="jobsTrained" value="relo">
                  <label class="form-check-label" for="newRelo">Relo</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="newHAU2" name="jobsTrained" value="hau2">
                  <label class="form-check-label" for="newHAU2">HAU2</label>
                </div>
              </div>
            </div>
          </fieldset>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Create User</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
